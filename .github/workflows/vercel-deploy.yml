name: Deploy Web to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/vercel-deploy.yml'
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Require Vercel secrets
        working-directory: .
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing GitHub secret VERCEL_TOKEN. Create one at https://vercel.com/account/tokens then run: gh secret set VERCEL_TOKEN"
            exit 1
          fi
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Missing VERCEL_ORG_ID or VERCEL_PROJECT_ID secrets."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Load production env for build
        run: |
          if [ -f .env.production ]; then
            cp .env.production .env.production.local
          fi
          if [ -f .vercel/.env.production.local ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              key="${line%%=*}"
              [ -z "$key" ] || [[ "$key" =~ ^# ]] && continue
              if ! grep -q "^${key}=" .env.production.local 2>/dev/null; then
                echo "$line" >> .env.production.local
              fi
            done < .vercel/.env.production.local
          fi

      - name: Build with Vercel
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to Vercel
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
