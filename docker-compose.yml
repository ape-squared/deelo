# Deelo — Discord bot + Next.js dashboard
#
# Local: copy env.docker.example → .env in project root
# Dokploy: paste the same keys into Compose → Environment (no env files on disk)
#
# Secrets use passthrough (KEY: with no value) so Dokploy-injected env vars
# reach containers without compose failing at parse time.

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DISCORD_TOKEN:
      SUPABASE_URL:
      SUPABASE_SERVICE_ROLE_KEY:
      OWNER_IDS:
      SUPPORT_GUILD_ID:
      STATUS_GUILD_ID:
      STATUS_CHANNEL_ID:
      STATUS_MESSAGE_ID:
      APP_URL:
      LASTFM_API_KEY:
      OPENAI_API_KEY:
      SPOTIFY_CLIENT_ID:
      SPOTIFY_CLIENT_SECRET:
      YOUTUBE_COOKIES:
      DEFAULT_PREFIX:
    # Voice uses UDP to Discord; bridge networking works on most hosts.
    # On Linux if music fails to connect, try: network_mode: host

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_DISCORD_CLIENT_ID: ${NEXT_PUBLIC_DISCORD_CLIENT_ID:-}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL:
      NEXT_PUBLIC_DISCORD_CLIENT_ID:
      NEXT_PUBLIC_SUPABASE_URL:
      NEXT_PUBLIC_SUPABASE_ANON_KEY:
      NEXT_PUBLIC_DISCORD_SERVER_ID:
      DISCORD_CLIENT_ID:
      DISCORD_CLIENT_SECRET:
      DISCORD_BOT_TOKEN:
      DISCORD_TOKEN:
      SUPABASE_URL:
      SUPABASE_SERVICE_ROLE_KEY:
      SESSION_SECRET:
