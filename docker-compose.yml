# Deelo — Discord bot + Next.js dashboard
#
# Setup:
#   1. cp .env.example .env          (bot secrets)
#   2. cp web/.env.local.example web/.env.local  (website secrets)
#   3. Add NEXT_PUBLIC_* vars to .env for web image build (see below)
#   4. docker compose up -d --build
#
# Web build-time vars (read from project-root .env for compose substitution):
#   NEXT_PUBLIC_APP_URL, NEXT_PUBLIC_DISCORD_CLIENT_ID,
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deelo-bot
    restart: unless-stopped
    env_file:
      - .env
    # Voice uses UDP to Discord; bridge networking works on most hosts.
    # On Linux if music fails to connect, try: network_mode: host

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_DISCORD_CLIENT_ID: ${NEXT_PUBLIC_DISCORD_CLIENT_ID}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: deelo-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - web/.env.local
    environment:
      HOSTNAME: 0.0.0.0
