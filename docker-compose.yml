# Deelo — Discord bot + Next.js dashboard
#
# Local: copy env.docker.example → .env in project root
# Dokploy: set the same keys in Compose → Environment
#
# Docker Compose loads substitution values from the shell environment and
# from a project-root .env file automatically.

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-${NEXT_PUBLIC_DISCORD_CLIENT_ID:-}}
      OWNER_IDS: ${OWNER_IDS:-}
      SUPPORT_GUILD_ID: ${SUPPORT_GUILD_ID:-}
      STATUS_GUILD_ID: ${STATUS_GUILD_ID:-}
      STATUS_CHANNEL_ID: ${STATUS_CHANNEL_ID:-}
      STATUS_MESSAGE_ID: ${STATUS_MESSAGE_ID:-}
      STATUS_INTERNAL_URL: ${STATUS_INTERNAL_URL:-http://web:3000}
      OFFICIAL_GUILD_ID: ${OFFICIAL_GUILD_ID:-${NEXT_PUBLIC_DISCORD_SERVER_ID:-}}
      CHANGELOG_CHANNEL_ID: ${CHANGELOG_CHANNEL_ID:-1523875521975287869}
      APP_URL: ${APP_URL:-${NEXT_PUBLIC_APP_URL:-}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PUTER_AUTH_TOKEN: ${PUTER_AUTH_TOKEN:-}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      YOUTUBE_COOKIES: ${YOUTUBE_COOKIES:-}
      DEFAULT_PREFIX: ${DEFAULT_PREFIX:-,}
    # Voice uses UDP to Discord; bridge networking works on most hosts.
    # On Linux if music fails to connect, try: network_mode: host

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_DISCORD_CLIENT_ID: ${NEXT_PUBLIC_DISCORD_CLIENT_ID:-}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    restart: unless-stopped
    # ports:
    #   - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
      NEXT_PUBLIC_DISCORD_CLIENT_ID: ${NEXT_PUBLIC_DISCORD_CLIENT_ID:-}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      NEXT_PUBLIC_DISCORD_SERVER_ID: ${NEXT_PUBLIC_DISCORD_SERVER_ID:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-${NEXT_PUBLIC_DISCORD_CLIENT_ID:-}}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      # Web needs the bot token to post ticket panels, role buttons, embeds, etc.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-${DISCORD_TOKEN}}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      OWNER_IDS: ${OWNER_IDS:-}
      APP_URL: ${APP_URL:-${NEXT_PUBLIC_APP_URL:-}}
